name: Publish docs
description: >-
  Push a previously built docs artifact to the gh-pages branch, which is what
  serves https://ysig.github.io/GraKeL/. The docs are filed under their version
  number and also copied to latest/, which is where the README links point.

inputs:
  artifact:
    description: "Name of the artifact holding the built html"
    required: false
    default: docs-html
  version:
    description: "Version to file the docs under; read from pyproject.toml if unset"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout gh-pages
      uses: actions/checkout@v7
      with:
        ref: gh-pages
        path: gh-pages

    - name: Download built docs
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact }}
        path: docs-html

    - name: Publish to https://ysig.github.io/GraKeL/
      shell: bash
      env:
        REQUESTED_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        version="$REQUESTED_VERSION"
        if [ -z "$version" ]; then
          version=$(sed -n "s/^version[[:space:]]*=[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" \
                    pyproject.toml | head -n 1)
        fi
        if [ -z "$version" ]; then
          echo "could not determine the version to publish under" >&2
          exit 1
        fi
        echo "Publishing the docs as $version"

        cd gh-pages

        # Clear the root, keeping git metadata, latest/, and every versioned
        # directory -- anything starting with a digit, which covers both the
        # old 0.1aN releases and the current scheme. This also sweeps up the
        # loose html left at the root by earlier publishes.
        find . -mindepth 1 -maxdepth 1 \
          ! -name '.git' ! -name 'latest' ! -name '[0-9]*' \
          -exec rm -rf {} +

        rm -rf "$version" latest
        mkdir -p "$version" latest
        cp -R ../docs-html/. "$version"/
        # latest/ is what the README deep links point at
        cp -R ../docs-html/. latest/

        # Send the root of the site to the current docs
        printf '<meta http-equiv="refresh" content="0; latest/"/>\n' > index.html
        # Stop github pages running the output through jekyll
        touch .nojekyll

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        if git diff --cached --quiet; then
          echo "Docs unchanged, nothing to publish"
        else
          git commit -m "Publish $version docs for ${GITHUB_SHA} [ci skip]"
          git push
        fi
