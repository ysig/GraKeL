name: Publish docs
description: >-
  Push a previously built docs artifact to the gh-pages branch, which is what
  serves https://ysig.github.io/GraKeL/.

inputs:
  artifact:
    description: "Name of the artifact holding the built html"
    required: false
    default: docs-html

runs:
  using: composite
  steps:
    - name: Checkout gh-pages
      uses: actions/checkout@v7
      with:
        ref: gh-pages
        path: gh-pages

    - name: Download built docs
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact }}
        path: docs-html

    - name: Publish to https://ysig.github.io/GraKeL/
      shell: bash
      working-directory: gh-pages
      run: |
        # Drop the previously published site, but keep git metadata and the
        # archived docs of the old releases (0.1a6, 0.1a7, 0.1a8), which are
        # still linked to from elsewhere
        find . -mindepth 1 -maxdepth 1 \
          ! -name '.git' ! -name '0.1a*' -exec rm -rf {} +

        cp -R ../docs-html/. .
        # Stop github pages running the output through jekyll
        touch .nojekyll

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        if git diff --cached --quiet; then
          echo "Docs unchanged, nothing to publish"
        else
          git commit -m "Publish docs for ${GITHUB_SHA} [ci skip]"
          git push
        fi
