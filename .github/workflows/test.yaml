name: Tests

on:
  # Allow to manually trigger through github API
  workflow_dispatch:

  # Allow the release pipeline to gate wheel builds on these tests
  workflow_call:

  # Triggers with push to master
  push:
    branches:
      - master

  # Triggers with push to a pr aimed at master
  pull_request:
    branches:
      - master

  schedule:
    # https://crontab.guru/#42_2_3_*_*
    # "At 02:42 on day-of-month 3"
    # Put it at this odd time to reduce competing with load spikes on github action servers
    - cron: '42 2 3 * *'

# NOTE: no `concurrency` here on purpose. In a workflow called through
# workflow_call, github.workflow resolves to the *calling* workflow, so a
# concurrency group defined here collides with the caller's own group and the
# pipeline deadlocks against itself. The caller does the cancelling.

env:

  import-package-name: grakel
  test-dir: tests
  codecov-args: >-
    --cov=grakel
    --cov-report=xml

jobs:

  # General unit tests
  source-test:
    name: ${{ matrix.py }}-${{ matrix.os }}

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # Default to using bash on all

    strategy:
      fail-fast: false
      matrix:
        # Every supported Python is exercised on Linux. The other platforms
        # run the boundaries of the support range (oldest/newest); the release
        # pipeline builds and tests a wheel for every version on every OS.
        include:
          - { py: "3.10", os: "ubuntu-latest", coverage: true }
          - { py: "3.11", os: "ubuntu-latest" }
          - { py: "3.12", os: "ubuntu-latest" }
          - { py: "3.13", os: "ubuntu-latest" }
          - { py: "3.14", os: "ubuntu-latest" }
          - { py: "3.10", os: "macos-latest" }
          - { py: "3.14", os: "macos-latest" }
          - { py: "3.10", os: "windows-latest" }
          - { py: "3.14", os: "windows-latest" }

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.py }}

    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0

    - name: Install ${{ env.import-package-name }}
      # cvxopt stays out of the core matrix (its wheels are only guaranteed on
      # some platforms/versions); it is exercised by the dedicated cvxopt-test
      # job below.
      run: |
        uv sync --locked --extra test

    - name: Tests
      run: |
        uv run python -m pytest ${{ matrix.coverage && env.codecov-args || '' }} ${{ env.test-dir }}

    - name: Upload coverage
      uses: codecov/codecov-action@v7
      # Only upload coverage when it's **not** a scheduled test run
      if: matrix.coverage && ! github.event.schedule
      with:
        # Tokenless uploads are rejected ("Token required because branch is
        # protected"), so the report needs the repository upload token
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true

  # The optional cvxopt dependency (Lovasz-theta and SVM-theta kernels) is
  # exercised once, on Linux, at the newest supported Python.
  cvxopt-test:
    name: cvxopt-test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0

    - name: Install ${{ env.import-package-name }}
      run: |
        uv sync --locked --all-extras

    - name: Tests
      run: |
        uv run python -m pytest ${{ env.test-dir }}
