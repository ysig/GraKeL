name: Docs

on:
  # Manual trigger: refreshes https://ysig.github.io/GraKeL/ on its own, without
  # having to run the whole release pipeline just to update the website.
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the docs to https://ysig.github.io/GraKeL/"
        required: false
        default: true
        type: boolean

  # Allow the release pipeline to gate publishing on the docs building
  workflow_call:

  # Triggers with push to master
  push:
    branches:
      - master

  # Triggers with push to a pr aimed at master
  pull_request:
    branches:
      - master

# NOTE: no `concurrency` here on purpose -- see the comment in test.yaml.

jobs:

  build:
    name: Sphinx html + doctest
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0

    - name: Install grakel
      run: |
        uv sync --locked

    - name: Build docs and run doctests
      run: |
        cd doc
        uv run --with "sphinx>=6,<9" --with "sphinx-gallery>=0.15" \
          --with "sphinx-rtd-theme" --with "sphinxcontrib-bibtex>=2.5" \
          --with "numpydoc" --with "matplotlib" --with "pillow" \
          make clean html doctest

    # Handed to the release pipeline, which publishes it to github pages
    - name: Upload built docs
      uses: actions/upload-artifact@v7
      with:
        name: docs-html
        path: doc/_build/html

  # Only on an explicit manual run: pushes and pull requests just build, and the
  # release pipeline has its own publish step gated behind the whole matrix.
  publish:
    name: Publish docs
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Needed for the composite action living in this repository
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/publish-docs
