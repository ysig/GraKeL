# Release pipeline
# ================
# Run this from the Actions tab when a new version is ready to go out. It runs
# the full test matrix, builds the wheels and the sdist, builds the docs, and
# then -- only if all of that is green -- publishes to PyPI and to github pages.
#
# Ordinary pushes do not come through here: they only run Tests and Docs.
#
# Both deployments are opt-in switches on the run dialog, so the same button
# can be used for a dry run that just proves everything builds.
#
# Guides
# ------
# cibuildwheel docs:
# * https://cibuildwheel.readthedocs.io/en/stable/options/
# github actions:
# * https://docs.github.com/en/actions

name: Release

# Releasing is deliberately a button, not something a push triggers: run the
# workflow from the Actions tab when a new version is ready to go out. Ordinary
# pushes only run the tests and the docs build.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish the release to PyPI"
        required: false
        default: false
        type: boolean
      publish_docs:
        description: "Publish the docs to https://ysig.github.io/GraKeL/"
        required: false
        default: true
        type: boolean

# Never cancel a release half way through: a second run queues behind the first
# rather than interrupting a publish in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  package-name: GraKeL

  test-cmd: pytest
  extra-requires: "wheel"
  sdist-version: "3.9"

jobs:

  # Nothing gets built until the full test matrix is green
  tests:
    name: Tests
    uses: ./.github/workflows/test.yaml
    secrets: inherit

  # Docs have to build too, but they don't gate the wheels, only the upload
  docs:
    name: Docs
    uses: ./.github/workflows/docs.yaml
    secrets: inherit

  build_wheels:
    name: Wheels ${{ matrix.os }}-${{ matrix.py.tag }}
    needs: tests
    runs-on: ${{ matrix.os }}

    # Parellilize as much as possible across github action workers
    strategy:
      # 1 runner per combination of (os, py)
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        py:
          - { cibw: "cp39-*", tag: "cp39" }
          - { cibw: "cp310-*", tag: "cp310" }
          - { cibw: "cp311-*", tag: "cp311" }
          - { cibw: "cp312-*", tag: "cp312" }
      # All workers independent, don't cancel all if one fails
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      # Let's us build aarch64 on linux
      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

        # https://cibuildwheel.readthedocs.io/en/1.x/options
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD_FRONTEND: "build[uv]"
          CIBW_BUILD: ${{ matrix.py.cibw }}
          CIBW_ARCHS_MACOS: x86_64 universal2
          CIBW_ARCHS_LINUX: x86_64 aarch64
          # No win32 ("x86") for Windows as scipy declared it has stopped releasing wheels
          # from 1.8.0 onwards, officially from 1.9.3
          CIBW_ARCHS_WINDOWS: AMD64
          # Install test requirements and run the test-cmd
          CIBW_TEST_EXTRAS: ${{ env.extra-requires }}
          # {project} is a special string recognized by CIBW and replaced with the project dir
          CIBW_TEST_COMMAND: ${{ env.test-cmd }} {project}
          # * Scipy has no wheels released for musllinux and will not build because OpenBLAS is not found
          CIBW_SKIP: "*-musllinux*"
          # https://cibuildwheel.readthedocs.io/en/stable/options/#test-skip
          # * Will avoid testing on emulated architectures (aarch64)
          # * Skip trying to test arm64 builds on Intel Macs
          CIBW_TEST_SKIP: "*-*linux_aarch64 *-macosx_universal2:arm64 "

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.py.tag }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: sdist
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ${{ env.package-name }}
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.sdist-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Build source distribution
        run: |
          uv build --sdist
          echo "sdist_name=$(ls -t dist/*.tar.gz | head -n 1)" >> $GITHUB_ENV

      - name: Twine check ${{ env.package-name }}
        run: |
          uvx twine check ${{ env.sdist_name }} --strict

      - name: Install dist
        run: |
          uv venv
          uv pip install --python .venv ${{ env.sdist_name }}
          uv pip install --python .venv pytest

      - name: Tests
        run: |
          .venv/bin/python -m pytest

      - name: Store artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  release_assets:
    # Only when manually specified
    if: ${{ inputs.deploy }}

    name: Upload Release
    runs-on: ubuntu-latest
    # Publish only once tests, wheels, sdist and docs are all green
    needs: [build_wheels, build_sdist, docs]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          # Only the distributions -- the docs artifact must not land in dist/
          pattern: "{sdist,wheel-*}"
          path: dist
          merge-multiple: true

      - name: Display structure of downloaded files
        run: |
          ls -R dist

      - name: Publish a Python distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
            password: ${{ secrets.PYPI_API_TOKEN }}
            packages-dir: dist/

  publish_docs:
    name: Publish docs
    # Everything has to be green before the site is replaced
    needs: [tests, docs, build_wheels, build_sdist]
    if: ${{ inputs.publish_docs }}

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Needed for the composite action living in this repository
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/publish-docs

  # Single place to look to see whether the release went out, and what of it
  summary:
    name: Release summary
    needs: [tests, docs, build_wheels, build_sdist, release_assets, publish_docs]
    # Report even when something upstream failed or was skipped
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Write the summary
        run: |
          {
            echo "## GraKeL release"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Tests | ${{ needs.tests.result }} |"
            echo "| Docs build | ${{ needs.docs.result }} |"
            echo "| Wheels | ${{ needs.build_wheels.result }} |"
            echo "| Source distribution | ${{ needs.build_sdist.result }} |"
            echo "| Published to PyPI | ${{ needs.release_assets.result }} |"
            echo "| Published the docs | ${{ needs.publish_docs.result }} |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          built='${{ needs.tests.result }}${{ needs.docs.result }}${{ needs.build_wheels.result }}${{ needs.build_sdist.result }}'
          if [ "$built" = "successsuccesssuccesssuccess" ]; then
            echo "Everything built and tested cleanly." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Something did not pass -- nothing should be released from this run.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "${{ needs.release_assets.result }}" = "skipped" ]; then
            echo "PyPI publishing was switched off for this run." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ needs.publish_docs.result }}" = "skipped" ]; then
            echo "Docs publishing was switched off for this run." >> "$GITHUB_STEP_SUMMARY"
          fi
